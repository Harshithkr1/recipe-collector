<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Collector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated Kitchen Background -->
  <div class="kitchen-bg" aria-hidden="true">
    <div class="kitchen-bg-photo"></div>
    <div class="kitchen-bg-tint"></div>
    <div class="kitchen-sunlight"></div>
  </div>

  <!-- Floating spice & herb decorations -->
  <div class="spice-bg" aria-hidden="true">
    <span class="spice s1"></span>
    <span class="spice s2"></span>
    <span class="spice s3"></span>
    <span class="spice s4"></span>
    <span class="spice s5"></span>
    <span class="spice s6"></span>
    <span class="spice s7"></span>
    <span class="spice s8"></span>
    <span class="spice s9"></span>
    <span class="spice s10"></span>
    <span class="spice s11"></span>
    <span class="spice s12"></span>
    <span class="spice s13"></span>
    <span class="spice s14"></span>
    <span class="spice s15"></span>
  </div>

  <header class="header-box">
    <h1>🍳 Recipe Collector</h1>
    <p class="tagline">~ Your personal family cookbook ~</p>
    <div class="stats-bar" id="statsBar">
      <span class="stat-item" id="statTotal">📖 0 Recipes</span>
      <span class="stat-divider">•</span>
      <span class="stat-item" id="statFavorites">❤️ 0 Favourites</span>
      <span class="stat-divider">•</span>
      <span class="stat-item" id="statCategories">📂 5 Categories</span>
    </div>
  </header>

  <div class="form-box">
    <h2 class="form-title">✦ Write a New Recipe ✦</h2>
    <input type="text" id="name" placeholder="Recipe name (e.g. Grandma's Butter Chicken)">
    
    <div class="form-field-group">
      <label for="category" class="field-label">Category</label>
      <select id="category" class="category-select">
        <option value="Breakfast">🥞 Breakfast & Brunch</option>
        <option value="Main Course" selected>🍛 Main Course</option>
        <option value="Snacks">🥗 Snacks & Quick Bites</option>
        <option value="Desserts">🍧 Desserts & Sweets</option>
        <option value="Drinks">☕ Beverages & Drinks</option>
      </select>
    </div>

    <textarea id="ingredients" placeholder="Ingredients (one per line or comma-separated)"></textarea>
    <textarea id="steps" placeholder="Cooking steps and secret tips..."></textarea>
    <input type="text" id="imageUrl" placeholder="Image URL (optional)">
    <button id="addBtn">Add Recipe</button>
  </div>

  <!-- Search & Category Filters -->
  <section class="controls-panel">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search recipes by name or ingredient...">
      <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">✕</button>
    </div>

    <!-- Category filter tabs -->
    <div class="category-tabs" id="categoryTabs">
      <!-- Injected by script.js -->
    </div>
  </section>

  <div id="recipeList"></div>

  <!-- Micro-interaction Toast -->
  <div id="toast" class="cookbook-toast" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
